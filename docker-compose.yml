services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailmind-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-retail}:${POSTGRES_PASSWORD:-retail_dev_password}@db:5432/${POSTGRES_DB:-retail_intelligence}
      CORS_ORIGINS: http://localhost:3000,http://localhost:4000,http://localhost:5173
      API_KEY: ${API_KEY:-retailmind-dev-api-key}
    volumes:
      - model_artifacts:/app/artifacts
      - uploaded_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - retail_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retailmind-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Resolved by the browser, not by the frontend container — so it must be the
      # host-published address of the backend, not the "backend" service hostname.
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_API_KEY: ${API_KEY:-retailmind-dev-api-key}
      VITE_USE_MOCKS: "false"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - retail_network
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: retailmind-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-retail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retail_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retail} -d ${POSTGRES_DB:-retail_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - retail_network
    restart: unless-stopped

volumes:
  pgdata:
  model_artifacts:
  uploaded_data:

networks:
  retail_network:
    driver: bridge
